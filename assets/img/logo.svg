<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo SIAP TES">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223e78"/>
      <stop offset="56%" stop-color="#315ca8"/>
      <stop offset="100%" stop-color="#257c87"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="24%" cy="16%" r="72%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="st-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde082"/>
      <stop offset="100%" stop-color="#e09a2b"/>
    </linearGradient>
    <filter id="st-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#102042" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Modern Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#st-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#st-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Subtle Academic Shield Frame -->
  <path d="M256 84 L384 128 V246 C384 334 330 398 256 428 C182 398 128 334 128 246 V128 Z"
        fill="#ffffff" fill-opacity="0.09"
        stroke="#ffffff" stroke-opacity="0.34" stroke-width="10" stroke-linejoin="round"/>

  <!-- Open Book / Study Arc at Lower Shield (Clean Breathing Space) -->
  <path d="M192 348 Q224 333 256 348 Q288 333 320 348"
        fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="11" stroke-linecap="round"/>

  <!-- Bold Iconic "SIAP" Checkmark (Passing & Readiness Symbol) -->
  <path d="M174 234 L230 288 L346 170"
        fill="none" stroke="#ffffff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#st-drop)"/>

  <!-- Warm Honey-Gold 4-Point Excellence Spark -->
  <path d="M372 100 L381.5 126.5 L408 136 L381.5 145.5 L372 172 L362.5 145.5 L336 136 L362.5 126.5 Z"
        fill="url(#st-gold)"/>
</svg>
