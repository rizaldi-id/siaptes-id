<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Logo SIAP TES">
  <defs>
    <linearGradient id="st-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#193468"/>
      <stop offset="55%" stop-color="#28559e"/>
      <stop offset="100%" stop-color="#1e7b93"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="24%" cy="16%" r="74%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.06"/>
    </radialGradient>
    <linearGradient id="st-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="st-cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f1ff"/>
    </linearGradient>
    <filter id="st-drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0e1e40" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Modern Squircle Badge -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#st-bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#st-glow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>

  <g filter="url(#st-drop)">
    <!-- Mortarboard Cap Crown (Academic Base) -->
    <path d="M174 198 V252 C174 274 210 290 256 290 C302 290 338 274 338 252 V198 L256 234 Z"
          fill="#d9e7ff" fill-opacity="0.92"/>

    <!-- Sculpted Graduation Cap Top Board -->
    <path d="M256 106 L392 164 C397 166 397 172 392 174 L256 232 L120 174 C115 172 115 166 120 164 Z"
          fill="url(#st-cap)"/>

    <!-- Gold Cap Button & Hanging Tassel -->
    <circle cx="256" cy="168" r="10" fill="url(#st-gold)"/>
    <path d="M256 168 L368 182 V244"
          fill="none" stroke="url(#st-gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="368" cy="246" r="9" fill="url(#st-gold)"/>
    <path d="M359 252 H377 L384 286 Q368 293 352 286 Z" fill="url(#st-gold)"/>

    <!-- Open Book of Knowledge: Left Page -->
    <path d="M251 324 C216 298 158 296 122 314 V394 C158 378 216 382 251 404 Z"
          fill="#ffffff"/>

    <!-- Open Book of Knowledge: Right Page -->
    <path d="M261 324 C296 298 354 296 390 314 V394 C354 378 296 382 261 404 Z"
          fill="#eaf2ff"/>

    <!-- Golden Supporting Book Binding Arc -->
    <path d="M114 406 C162 388 214 394 256 416 C298 394 350 388 398 406"
          fill="none" stroke="url(#st-gold)" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
